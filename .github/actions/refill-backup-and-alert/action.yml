name: Refill backups and alert
description: >-
  Shared tail of every daily-bars refill (gap-refill.yml and the scan job's inline refill). Keeps the
  pre-images src/gap-refill.ts wrote to refill-backup/ as an artifact, and on failure opens (or
  comments on) the "Daily-bars gap refill needs a person" scanner-alert issue. Needs issues write.
inputs:
  artifact-name:
    description: Artifact name for refill-backup/
    required: true
  outcome:
    description: The refill's outcome; exactly "failure" opens the alert
    required: true
runs:
  using: composite
  steps:
    # Alert first, so a failed artifact upload can never suppress it; the upload has always() so a
    # failed alert (gh error) cannot skip the backups either.
    - name: Alert on FAIL
      if: ${{ inputs.outcome == 'failure' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        t="Daily-bars gap refill needs a person"
        n="$(gh issue list --repo "$GITHUB_REPOSITORY" --label scanner-alert --state open --search "$t in:title" --json number --jq '.[0].number // empty')"
        body="Gap refill FAILED or refused (frozen config, verify, or write guard). Nothing was deleted. Run: $RUN_URL"
        if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
        else gh issue create --repo "$GITHUB_REPOSITORY" --title "$t" --label scanner-alert --assignee PeaceG03 --body "$body"; fi
    - name: Keep pre-images
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: refill-backup/
        retention-days: 90
        if-no-files-found: ignore
