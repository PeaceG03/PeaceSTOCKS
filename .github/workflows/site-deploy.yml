name: Site deploy
# Deploys the private PeaceSTOCKS site (src/read-worker.ts) to https://stocks.jjpeace.com.
# Manual only. Order is fail-closed: the Cloudflare Access app + single-email policy are created or
# updated and read back FIRST; if that fails, nothing is deployed. The Worker itself also refuses any
# request without a valid Access JWT for the allowed email (403/503), and reads R2 only with the
# read-only key pair. Never prints the email or any key.
on:
  workflow_dispatch:
    inputs:
      team_domain:
        description: "Cloudflare Access (Zero Trust) team domain. Not secret."
        required: true
        default: "blue-leaf-13b3.cloudflareaccess.com"
permissions:
  contents: read
concurrency:
  group: site-deploy
  cancel-in-progress: false
env:
  SITE_HOSTNAME: stocks.jjpeace.com
  WRANGLER_VERSION: 4.167.0
jobs:
  deploy:
    # Only from main: a dispatch on any other branch skips the job (no Access change, no deploy).
    if: github.ref == 'refs/heads/main'
    # GitHub environment "site": gives the deploy its own place for protection rules (e.g. required
    # reviewer) and deployment history. Created on first use if it does not exist.
    environment: site
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          # wrangler 4 (and miniflare, kv-asset-handler) require Node >= 22.12.
          node-version: "22.23.5"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Required secrets present (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
          PEACESTOCKS_R2_BUCKET: ${{ secrets.PEACESTOCKS_R2_BUCKET }}
          PEACESTOCKS_R2_READ_ACCESS_KEY_ID: ${{ secrets.PEACESTOCKS_R2_READ_ACCESS_KEY_ID }}
          PEACESTOCKS_R2_READ_SECRET_ACCESS_KEY: ${{ secrets.PEACESTOCKS_R2_READ_SECRET_ACCESS_KEY }}
          PEACESTOCKS_SITE_ALLOWED_EMAIL: ${{ secrets.PEACESTOCKS_SITE_ALLOWED_EMAIL }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PEACESTOCKS_R2_BUCKET PEACESTOCKS_R2_READ_ACCESS_KEY_ID PEACESTOCKS_R2_READ_SECRET_ACCESS_KEY PEACESTOCKS_SITE_ALLOWED_EMAIL; do
            if [ -z "${!name}" ]; then echo "::error::missing secret: $name"; missing=1; fi
          done
          exit "$missing"
      - name: Worker typecheck and site tests
        run: |
          pnpm run typecheck:worker
          pnpm exec tsx --test src/access-jwt.test.ts src/read-worker-site.test.ts src/site-page.test.ts src/r2-read-client.test.ts src/site-access-setup.test.ts
      - name: Cloudflare Access app and single-email policy (deploy stops here on failure)
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
          SITE_ALLOWED_EMAIL: ${{ secrets.PEACESTOCKS_SITE_ALLOWED_EMAIL }}
          ACCESS_TEAM_DOMAIN: ${{ inputs.team_domain }}
        run: pnpm exec tsx src/site-access-setup.ts
      - name: Deploy Worker (custom domain stocks.jjpeace.com)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
          ACCESS_AUD: ${{ steps.access.outputs.aud }}
          ACCESS_TEAM_DOMAIN: ${{ steps.access.outputs.team_domain }}
        run: |
          test -n "$ACCESS_AUD" && test -n "$ACCESS_TEAM_DOMAIN"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --var "ACCESS_AUD:${ACCESS_AUD}" --var "ACCESS_TEAM_DOMAIN:${ACCESS_TEAM_DOMAIN}"
      - name: Worker secrets (allowed email, read-only R2 keys)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
          ALLOWED_EMAIL: ${{ secrets.PEACESTOCKS_SITE_ALLOWED_EMAIL }}
          R2_BUCKET: ${{ secrets.PEACESTOCKS_R2_BUCKET }}
          R2_READ_ACCESS_KEY_ID: ${{ secrets.PEACESTOCKS_R2_READ_ACCESS_KEY_ID }}
          R2_READ_SECRET_ACCESS_KEY: ${{ secrets.PEACESTOCKS_R2_READ_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          file="$RUNNER_TEMP/site-secrets.json"
          trap 'rm -f "$file"' EXIT
          # Every value trimmed: a value pasted into the GitHub UI often ends in a newline, which breaks SigV4.
          node -e 'const e=process.env; const v={ALLOWED_EMAIL:e.ALLOWED_EMAIL,R2_ACCOUNT_ID:e.CLOUDFLARE_ACCOUNT_ID,R2_BUCKET:e.R2_BUCKET,R2_READ_ACCESS_KEY_ID:e.R2_READ_ACCESS_KEY_ID,R2_READ_SECRET_ACCESS_KEY:e.R2_READ_SECRET_ACCESS_KEY}; for (const k of Object.keys(v)) { v[k]=String(v[k] ?? "").trim(); if (!v[k]) { console.error("::error::"+k+" is missing or empty after trimming"); process.exit(1); } } require("fs").writeFileSync(process.argv[1], JSON.stringify(v))' "$file"
          npx --yes "wrangler@${WRANGLER_VERSION}" secret bulk "$file"
      - name: Confirm the site is not public
        # A brand-new custom domain can take minutes to get DNS and a certificate, so keep trying for
        # about 10 minutes. No answer (000), DNS or TLS errors and anything else unexpected: wait and
        # retry. Any 2xx: hard fail at once (the site answered without a login). Passes only on a
        # redirect to the Access login or a 401/403 refusal.
        timeout-minutes: 12
        run: |
          deadline=$(( $(date +%s) + 600 ))
          try=0
          while :; do
            try=$((try + 1))
            out=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 "https://${SITE_HOSTNAME}/" 2>/dev/null) || true
            code=${out%% *}
            loc=${out#"$code"}
            loc=${loc# }
            case "$code" in
              2[0-9][0-9])
                echo "::error::https://${SITE_HOSTNAME}/ answered ${code} without a login"
                exit 1 ;;
              401|403)
                echo "SITE_GATED: refused without a login (${code})"
                exit 0 ;;
              301|302|303|307|308)
                if [[ "$loc" =~ ^https://[a-z0-9-]+\.cloudflareaccess\.com/cdn-cgi/access/login/ ]]; then
                  echo "SITE_GATED: redirects to the Access login (${code})"
                  exit 0
                fi ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::could not confirm the Access login on https://${SITE_HOSTNAME}/ after ${try} tries (last answer ${code:-none})"
              exit 1
            fi
            echo "waiting for ${SITE_HOSTNAME} (got ${code:-none}); try ${try}"
            sleep 15
          done
