name: Tests
# Full suite + typechecks on every push and PR. Read-only: contents: read, no secrets, no R2, no Massive.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Typecheck lib sources
        run: pnpm run typecheck:lib
      - name: Test suite
        run: pnpm test
      # The research ledger must be append-only against main (src/research-ledger-check.ts): main's
      # committed heads still in the chain, its held-out markers unchanged. Read-only git, no network.
      - name: Research ledger is append-only against main
        run: pnpm -s exec tsx src/research-ledger-check.ts origin/main
