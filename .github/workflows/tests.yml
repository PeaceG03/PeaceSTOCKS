name: Tests
# Full suite + typechecks on every push and PR. Read-only: contents: read, no secrets, no R2, no Massive.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Typecheck lib sources
        run: pnpm run typecheck:lib
      - name: Test suite
        run: pnpm test
