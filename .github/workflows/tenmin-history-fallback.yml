name: Ten-minute history fallback

# Restarts an auto re-dispatch chain for scanner.yml tenmin_history that a guard window, a queued
# run, or a lost pending run broke. It only decides and dispatches; the dispatched run is an
# ordinary scanner.yml run in the peacestocks-r2-writer group. This workflow is deliberately NOT in
# that group: joining it would replace (cancel) a pending scan.
# Triggers (all run the same decide job):
# - workflow_call: scanner.yml's hourly restarter job (cron "47 * * * *"), the primary trigger.
# - workflow_dispatch with wait_for_guard_window_end=true: the heal dispatch a tenmin_history run's
#   chain step sends when it waits on a guard window; guard_wait sleeps until the window ends.
# - workflow_dispatch (manual) and this file's own schedule (best effort; it has never fired).
on:
  workflow_dispatch:
    inputs:
      wait_for_guard_window_end:
        description: "Sleep until the current/next guard window ends before deciding (heal dispatch)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      wait_for_guard_window_end:
        required: false
        default: false
        type: boolean
  schedule:
    # Daily picks (TENMIN_DAILY_PICKS) ride along when history restarts; still requires
    # the repo var to be exactly "true". Guard windows still skip fetches.
    # Every 2 hours at :47 on even hours (00:47, 02:47, ..., 22:47 UTC): off the :00/:30 marks
    # and, on time, outside the 05:15–06:15 / 09:15–10:15 UTC guard windows (scans at 05:30 /
    # 09:30). A late cron that lands inside a window is still skipped by decideTenMinRedispatch
    # with WAIT_GUARD_WINDOW. Changed from "17 */2 * * *" (2026-10-10): that schedule never
    # produced a single run.
    - cron: "47 */2 * * *"

permissions:
  contents: read
  actions: write
  # issues: write lets the stop-alert step open/close the scanner-alert issue.
  issues: write

jobs:
  # Heal path only: sleep (outside every concurrency group, so no scan or history run waits on it)
  # until the guard window that blocked the chain has ended, plus a 2 min margin. No-op otherwise.
  guard_wait:
    if: ${{ vars.TENMIN_AUTO_REDISPATCH == 'true' && inputs.wait_for_guard_window_end }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for the guard window to end
        run: pnpm exec tsx src/tenmin-redispatch.ts guard-wait

  decide:
    needs: guard_wait
    # Kill switch: nothing runs unless the repo variable is exactly "true". Runs when guard_wait
    # finished or was skipped (not on the heal path).
    if: ${{ always() && vars.TENMIN_AUTO_REDISPATCH == 'true' && (needs.guard_wait.result == 'success' || needs.guard_wait.result == 'skipped') }}
    # One decide at a time across every trigger (restarter, heal, manual, schedule). Job level, so a
    # sleeping guard_wait never holds it. Deliberately NOT peacestocks-r2-writer: joining it would
    # replace (cancel) a pending scan.
    concurrency:
      group: tenmin-history-fallback
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the newest tenmin_history run record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/record"
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tenmin-history-record&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n tenmin-history-record -D "$RUNNER_TEMP/record"
          fi
      - name: Decide and dispatch
        id: redispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENMIN_AUTO_REDISPATCH: ${{ vars.TENMIN_AUTO_REDISPATCH }}
          TENMIN_AUTO_REDISPATCH_MAX_CHAIN: ${{ vars.TENMIN_AUTO_REDISPATCH_MAX_CHAIN }}
          # Same cap as the history job: a raised or cleared value restarts a chain stopped at the
          # old cap; an invalid value fails this step loudly.
          TENMIN_HISTORY_MAX_RANGE_END: ${{ vars.TENMIN_HISTORY_MAX_RANGE_END }}
          TENMIN_RECORD_FILE: ${{ runner.temp }}/record/tenmin-history-record.json
          TENMIN_DISPATCH_REF: ${{ github.event.repository.default_branch }}
        # After a dispatch: if a scheduled scanner.yml run created in the last 10 min was cancelled,
        # rewrite TENMIN_RECORD_FILE to STOP_SCAN_CANCELLED, cancel the just-dispatched tenmin_history
        # run (queued/waiting/pending/requested/in_progress; skip if already completed), and fail with
        # TENMIN_REDISPATCH_SCAN_CANCELLED. In fallback the dispatch is usually already in_progress;
        # cancelling it is safe (its always() chain step records STOP_JOB_CANCELLED).
        run: pnpm exec tsx src/tenmin-redispatch.ts fallback
      # On SCAN_CANCELLED the decide step rewrites the record to a hard stop. Upload it so the next
      # fallback sees STOP_SCAN_CANCELLED instead of the older continue artifact (a cancelled
      # dispatched run that never started uploads nothing, so it cannot leave a newer continue).
      - name: Keep stop record for the next fallback
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: tenmin-history-record
          path: ${{ runner.temp }}/record/tenmin-history-record.json
          retention-days: 14
          if-no-files-found: warn
      # Same stop alert as scanner.yml (src/tenmin-alert.ts): alert when the fallback finds a stopped
      # chain it will not restart or its own check fails; close the open alert when it restarts the
      # chain. Planned waits, a manual pause, or another scanner run being active never alert.
      # Already-reported stops (same run + reason) are not repeated every 2 hours.
      - name: Stop alert (issue)
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENMIN_AUTO_REDISPATCH: ${{ vars.TENMIN_AUTO_REDISPATCH }}
          TENMIN_REDISPATCH_STEP: ${{ steps.redispatch.outcome }}
          TENMIN_NEXT_ACTION: ${{ steps.redispatch.outputs.next_action }}
          TENMIN_REASON: ${{ steps.redispatch.outputs.reason }}
          TENMIN_RECORD_FILE: ${{ runner.temp }}/record/tenmin-history-record.json
        run: pnpm exec tsx src/tenmin-alert.ts fallback
