name: Scanner
# Restarter runs (cron "47 * * * *") are named "Scanner restarter" so the history chain, the
# restarter itself, and the stop alert never count them as a scan/history run (src/tenmin-redispatch.ts
# TENMIN_RESTARTER_RUN_NAME). Every other run keeps the name "Scanner".
run-name: ${{ github.event.schedule == '47 * * * *' && 'Scanner restarter' || 'Scanner' }}

on:
  # Intentionally no push trigger: online work is schedule + workflow_dispatch only.
  # Push events that only change this file must not start a scan or backfill.
  workflow_dispatch:
    inputs:
      mode:
        description: "scan (online scheduler), backfill (daily historical evidence), tenmin_history (10-minute range history), or tenmin_daily (daily 10-minute picks; kill switch TENMIN_DAILY_PICKS)"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - backfill
          - tenmin_history
          - tenmin_daily
      from:
        description: "Backfill from date (YYYY-MM-DD inclusive)"
        required: false
        default: "2026-08-21"
      to:
        description: "Backfill to date (YYYY-MM-DD inclusive)"
        required: false
        default: "2026-10-02"
      max_sessions:
        description: "Max trading sessions to attempt during backfill"
        required: false
        default: "35"
      tenmin_history_reopen:
        description: "tenmin_history only: reopen sealed ranges to retry gaps + new securities (default off)"
        required: false
        default: false
        type: boolean
      tenmin_history_max_ranges:
        description: "tenmin_history only: max two-month ranges to attempt (empty = no cap)"
        required: false
        default: ""
      tenmin_history_budget_ms:
        description: "tenmin_history only: wall-clock budget in ms; default 110 min so the run stops cleanly before the 120 min job timeout"
        required: false
        default: "6600000"
      tenmin_history_chain:
        description: "tenmin_history only: run number in an auto re-dispatch chain (0 = started by a human; set by the chain)"
        required: false
        default: "0"
  schedule:
    # 05:30 UTC Tue–Sat: just after midnight ET (00:30 EST / 01:30 EDT) so collectionDue targets the
    # previous ET trading day (S2: due only when ET date strictly after D). Saturday covers Friday.
    - cron: "30 5 * * 2-6"
    # Later UTC morning retry if Massive was not ready yet (04:30 EST / 05:30 EDT). Saturday covers Friday.
    - cron: "30 9 * * 2-6"
    # Ten-minute history restarter: hourly at :47 (off the :00/:30 marks). Runs ONLY the restarter
    # job (tenmin-history-fallback.yml via workflow_call); the scan job skips this cron. The decide
    # step waits (no dispatch) inside or just before a guard window and while any scan/history run
    # is active. Must match TENMIN_RESTARTER_CRON in src/tenmin-redispatch.ts.
    - cron: "47 * * * *"

# One writer at a time: scans and backfills both write R2 (month files, cursor), so they queue
# instead of overlapping. A run already in progress is never canceled.
# Restarter runs (cron "47 * * * *") write nothing to R2 and get their own per-run group: joining
# peacestocks-r2-writer would let a restarter run replace (cancel) a pending scan or history run.
# Every other run is in peacestocks-r2-writer exactly as before.
concurrency:
  group: ${{ github.event.schedule == '47 * * * *' && format('scanner-restarter-{0}', github.run_id) || 'peacestocks-r2-writer' }}
  cancel-in-progress: false

jobs:
  scan:
    # Not on the restarter cron: that tick only runs the restarter job below.
    if: ${{ (github.event_name == 'schedule' && github.event.schedule != '47 * * * *') || github.event.inputs.mode == 'scan' }}
    # Pinned so the runner image cannot change mid-rollout; move to 26.04 deliberately later.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      PEACESTOCKS_R2_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
      PEACESTOCKS_R2_BUCKET: ${{ secrets.PEACESTOCKS_R2_BUCKET }}
      PEACESTOCKS_R2_ACCESS_KEY_ID: ${{ secrets.PEACESTOCKS_R2_ACCESS_KEY_ID }}
      PEACESTOCKS_R2_SECRET_ACCESS_KEY: ${{ secrets.PEACESTOCKS_R2_SECRET_ACCESS_KEY }}
      PEACESTOCKS_SOURCE_COMMIT: ${{ github.sha }}
      PEACESTOCKS_REQUIRE_OBJECT_STORE: "1"
      # Exactly "true" stores the scan's already-fetched grouped-daily reply as Reply Dust (no extra
      # Massive requests). Anything else leaves the scan unchanged.
      SCAN_GROUPED_REPLY_DUST: ${{ vars.SCAN_GROUPED_REPLY_DUST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reply Dust writes need exactly zstd 1.5.7 (different zstd builds can produce different bytes).
      # Build it from the checksum-verified release tarball, cache the binary, and put it first on PATH.
      # Non-blocking until Reply Dust is switched on, so a download hiccup can't stop a scan;
      # the writer itself refuses to start without exactly 1.5.7.
      - name: Restore pinned zstd 1.5.7
        id: zstd-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.local/zstd-1.5.7
          key: zstd-1.5.7-eb33e51f49a15e02-${{ runner.os }}-ubuntu-24.04
      - name: Build pinned zstd 1.5.7
        if: ${{ steps.zstd-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  zstd-1.5.7.tar.gz" | sha256sum -c -
          tar xzf zstd-1.5.7.tar.gz
          make -C zstd-1.5.7 -j"$(nproc)" zstd-release
          install -D -m 0755 zstd-1.5.7/programs/zstd ~/.local/zstd-1.5.7/bin/zstd
      - name: Use pinned zstd 1.5.7
        continue-on-error: true
        run: |
          set -euo pipefail
          ~/.local/zstd-1.5.7/bin/zstd --version | grep -F ' v1.5.7,'
          echo "$HOME/.local/zstd-1.5.7/bin" >> "$GITHUB_PATH"
      - name: Refuse a run that would write the store to the runner disk
        run: |
          test -n "$PEACESTOCKS_R2_BUCKET"
          test -n "$PEACESTOCKS_R2_ACCOUNT_ID"
          test -n "$PEACESTOCKS_R2_ACCESS_KEY_ID"
          test -n "$PEACESTOCKS_R2_SECRET_ACCESS_KEY"
          test -n "$MASSIVE_API_KEY"
          test -n "$PEACESTOCKS_SOURCE_COMMIT"
      - name: Run online scanner host
        env:
          PEACEAI_MARKETS_ROOT: ${{ runner.temp }}/peacestocks-scratch
        run: pnpm scheduler

  # Hourly ten-minute history restarter (cron "47 * * * *" only). Same decide-and-dispatch and stop
  # alert as tenmin-history-fallback.yml (reused via workflow_call, not duplicated). It rides on this
  # workflow's schedule because the fallback file's own schedule never fired.
  restarter:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '47 * * * *' }}
    permissions:
      contents: read
      actions: write
      issues: write
    uses: ./.github/workflows/tenmin-history-fallback.yml

  backfill:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backfill' }}
    # Pinned so the runner image cannot change mid-rollout; move to 26.04 deliberately later.
    runs-on: ubuntu-24.04
    # actions: read lets backfill see a queued scan and yield the Massive budget to it.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 120
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      PEACESTOCKS_R2_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
      PEACESTOCKS_R2_BUCKET: ${{ secrets.PEACESTOCKS_R2_BUCKET }}
      PEACESTOCKS_R2_ACCESS_KEY_ID: ${{ secrets.PEACESTOCKS_R2_ACCESS_KEY_ID }}
      PEACESTOCKS_R2_SECRET_ACCESS_KEY: ${{ secrets.PEACESTOCKS_R2_SECRET_ACCESS_KEY }}
      PEACESTOCKS_SOURCE_COMMIT: ${{ github.sha }}
      PEACESTOCKS_REQUIRE_OBJECT_STORE: "1"
      MARKETS_BACKFILL_FROM: ${{ github.event.inputs.from }}
      MARKETS_BACKFILL_TO: ${{ github.event.inputs.to }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reply Dust writes need exactly zstd 1.5.7 (different zstd builds can produce different bytes).
      # Build it from the checksum-verified release tarball, cache the binary, and put it first on PATH.
      # Non-blocking until Reply Dust is switched on, so a download hiccup can't stop a scan;
      # the writer itself refuses to start without exactly 1.5.7.
      - name: Restore pinned zstd 1.5.7
        id: zstd-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.local/zstd-1.5.7
          key: zstd-1.5.7-eb33e51f49a15e02-${{ runner.os }}-ubuntu-24.04
      - name: Build pinned zstd 1.5.7
        if: ${{ steps.zstd-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  zstd-1.5.7.tar.gz" | sha256sum -c -
          tar xzf zstd-1.5.7.tar.gz
          make -C zstd-1.5.7 -j"$(nproc)" zstd-release
          install -D -m 0755 zstd-1.5.7/programs/zstd ~/.local/zstd-1.5.7/bin/zstd
      - name: Use pinned zstd 1.5.7
        continue-on-error: true
        run: |
          set -euo pipefail
          ~/.local/zstd-1.5.7/bin/zstd --version | grep -F ' v1.5.7,'
          echo "$HOME/.local/zstd-1.5.7/bin" >> "$GITHUB_PATH"
      - name: Refuse a run that would write the store to the runner disk
        run: |
          test -n "$PEACESTOCKS_R2_BUCKET"
          test -n "$PEACESTOCKS_R2_ACCOUNT_ID"
          test -n "$PEACESTOCKS_R2_ACCESS_KEY_ID"
          test -n "$PEACESTOCKS_R2_SECRET_ACCESS_KEY"
          test -n "$MASSIVE_API_KEY"
          test -n "$PEACESTOCKS_SOURCE_COMMIT"
          test -n "$MARKETS_BACKFILL_FROM"
          test -n "$MARKETS_BACKFILL_TO"
      - name: Daily historical backfill into R2
        env:
          PEACEAI_MARKETS_ROOT: ${{ runner.temp }}/peacestocks-scratch
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm backfill --from "$MARKETS_BACKFILL_FROM" --to "$MARKETS_BACKFILL_TO" --max-sessions "${{ github.event.inputs.max_sessions }}"

  # Dispatch only: never on this workflow's schedule. Shares peacestocks-r2-writer concurrency with
  # scan/backfill so it queues behind (or ahead of) them; the host also yields via scanYieldReason.
  # Auto re-dispatch (repo variable TENMIN_AUTO_REDISPATCH == "true"): the last step dispatches the
  # next run on a clean partial. When it waits on a guard window it also dispatches
  # tenmin-history-fallback.yml (wait_for_guard_window_end), which sleeps outside this concurrency
  # group until the window ends and then restarts the chain; the hourly restarter covers the rest.
  tenmin_history:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'tenmin_history' }}
    runs-on: ubuntu-24.04
    # actions: write lets the last step dispatch the next run (GITHUB_TOKEN workflow_dispatch does
    # start a new run) and read the queue so it never dispatches while another run is waiting.
    permissions:
      contents: read
      actions: write
      # issues: write lets the last step open/close the scanner-alert issue.
      issues: write
    timeout-minutes: 120
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      PEACESTOCKS_R2_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
      PEACESTOCKS_R2_BUCKET: ${{ secrets.PEACESTOCKS_R2_BUCKET }}
      PEACESTOCKS_R2_ACCESS_KEY_ID: ${{ secrets.PEACESTOCKS_R2_ACCESS_KEY_ID }}
      PEACESTOCKS_R2_SECRET_ACCESS_KEY: ${{ secrets.PEACESTOCKS_R2_SECRET_ACCESS_KEY }}
      PEACESTOCKS_SOURCE_COMMIT: ${{ github.sha }}
      PEACESTOCKS_REQUIRE_OBJECT_STORE: "1"
      PEACESTOCKS_TENMIN_HISTORY: "1"
      # Daily picks first phase: must be exactly "true" (repo var). Default off when unset.
      TENMIN_DAILY_PICKS: ${{ vars.TENMIN_DAILY_PICKS }}
      # Dated ticker reference index phase (off unless exactly "true"). Probe unless FULL=true.
      TICKER_INDEX_DATED: ${{ vars.TICKER_INDEX_DATED }}
      TICKER_INDEX_DATED_FULL: ${{ vars.TICKER_INDEX_DATED_FULL }}
      # Repo variable (YYYY-MM-DD): ranges ending after it are not planned; at the cap the chain
      # stops with STOP_RANGE_END_CAP. Empty = no cap. Invalid = the run fails before any request.
      # Raising it later is a variable change only (the fallback restarts the chain).
      TENMIN_HISTORY_MAX_RANGE_END: ${{ vars.TENMIN_HISTORY_MAX_RANGE_END }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # History writing needs exactly zstd 1.5.7; host refuses to start without it (fatal even if
      # these steps are continue-on-error, matching scan/backfill pin steps).
      - name: Restore pinned zstd 1.5.7
        id: zstd-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.local/zstd-1.5.7
          key: zstd-1.5.7-eb33e51f49a15e02-${{ runner.os }}-ubuntu-24.04
      - name: Build pinned zstd 1.5.7
        if: ${{ steps.zstd-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  zstd-1.5.7.tar.gz" | sha256sum -c -
          tar xzf zstd-1.5.7.tar.gz
          make -C zstd-1.5.7 -j"$(nproc)" zstd-release
          install -D -m 0755 zstd-1.5.7/programs/zstd ~/.local/zstd-1.5.7/bin/zstd
      - name: Use pinned zstd 1.5.7
        continue-on-error: true
        run: |
          set -euo pipefail
          ~/.local/zstd-1.5.7/bin/zstd --version | grep -F ' v1.5.7,'
          echo "$HOME/.local/zstd-1.5.7/bin" >> "$GITHUB_PATH"
      - name: Refuse a run that would write the store to the runner disk
        run: |
          test -n "$PEACESTOCKS_R2_BUCKET"
          test -n "$PEACESTOCKS_R2_ACCOUNT_ID"
          test -n "$PEACESTOCKS_R2_ACCESS_KEY_ID"
          test -n "$PEACESTOCKS_R2_SECRET_ACCESS_KEY"
          test -n "$MASSIVE_API_KEY"
          test -n "$PEACESTOCKS_SOURCE_COMMIT"
      - name: Ten-minute history runner (Reply Dust ranges)
        id: history
        env:
          PEACEAI_MARKETS_ROOT: ${{ runner.temp }}/peacestocks-scratch
          GITHUB_TOKEN: ${{ github.token }}
          TENMIN_OUTCOME_FILE: ${{ runner.temp }}/tenmin-history-outcome.json
          PEACESTOCKS_TENMIN_HISTORY_REOPEN: ${{ github.event.inputs.tenmin_history_reopen == 'true' && '1' || '' }}
          PEACESTOCKS_TENMIN_HISTORY_MAX_RANGES: ${{ github.event.inputs.tenmin_history_max_ranges }}
          PEACESTOCKS_TENMIN_HISTORY_BUDGET_MS: ${{ github.event.inputs.tenmin_history_budget_ms }}
        run: pnpm scheduler
      # Decision logic is decideTenMinRedispatch (src/tenmin-redispatch.ts, unit-tested); it stops
      # on any refusal, error, outage, failure, bounded manual run, chain cap, or kill switch off,
      # and waits (no dispatch) in or just before a guard window or while another run is queued.
      # Right after a dispatch it lists scanner.yml runs; if a scheduled run created in the last 10 min
      # was cancelled it rewrites this run's record to STOP_SCAN_CANCELLED (hard stop for the
      # fallback), cancels the just-dispatched tenmin_history run while still queued/waiting/pending/
      # requested/in_progress (skips and reports if already completed), and fails with
      # TENMIN_REDISPATCH_SCAN_CANCELLED. Cancelling in_progress is safe: that run's always() chain
      # step sees the history step cancelled and records STOP_JOB_CANCELLED. The upload step below
      # runs after this (if: always), so the rewritten stop record is what the fallback reads.
      - name: Auto re-dispatch (chain)
        id: redispatch
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENMIN_AUTO_REDISPATCH: ${{ vars.TENMIN_AUTO_REDISPATCH }}
          TENMIN_AUTO_REDISPATCH_MAX_CHAIN: ${{ vars.TENMIN_AUTO_REDISPATCH_MAX_CHAIN }}
          TENMIN_CHAIN: ${{ github.event.inputs.tenmin_history_chain }}
          TENMIN_STEP_OUTCOME: ${{ steps.history.outcome }}
          TENMIN_OUTCOME_FILE: ${{ runner.temp }}/tenmin-history-outcome.json
          TENMIN_RECORD_FILE: ${{ runner.temp }}/tenmin-history-record.json
        run: pnpm exec tsx src/tenmin-redispatch.ts chain
      # The fallback workflow reads the newest record to decide whether to restart the chain.
      - name: Keep this run's record for the fallback
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tenmin-history-record
          path: ${{ runner.temp }}/tenmin-history-record.json
          retention-days: 14
          if-no-files-found: warn
      # Stop alert: one GitHub issue (label scanner-alert, assigned to the repo owner) when the chain
      # really stops or fails; comments on an open one instead of opening another; closes it with
      # "Chain running again" when a later run chains. No alert for a manual pause or a planned wait.
      # Logic: planTenMinAlert (src/tenmin-alert.ts, unit-tested). Never fails the job.
      - name: Stop alert (issue)
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TENMIN_AUTO_REDISPATCH: ${{ vars.TENMIN_AUTO_REDISPATCH }}
          TENMIN_HISTORY_STEP: ${{ steps.history.outcome }}
          TENMIN_REDISPATCH_STEP: ${{ steps.redispatch.outcome }}
          TENMIN_NEXT_ACTION: ${{ steps.redispatch.outputs.next_action }}
          TENMIN_REASON: ${{ steps.redispatch.outputs.reason }}
          TENMIN_RECORD_FILE: ${{ runner.temp }}/tenmin-history-record.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! pnpm exec tsx src/tenmin-alert.ts chain; then
            # Last resort when the alert script itself cannot run: one generic alert.
            body="The scanner alert check could not run. History step: ${TENMIN_HISTORY_STEP:-unknown}, chain step: ${TENMIN_REDISPATCH_STEP:-unknown}. Run: $RUN_URL"
            n="$(gh issue list --repo "$GITHUB_REPOSITORY" --label scanner-alert --state open --json number --jq '.[0].number // empty')"
            if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "Scanner stopped: alert check failed" --label scanner-alert --assignee PeaceG03 --body "$body"; fi
          fi

  # Standalone daily 10-minute picks. Shares peacestocks-r2-writer. Kill switch TENMIN_DAILY_PICKS
  # must be exactly "true" (repo var); workflow does not force it on.
  tenmin_daily:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'tenmin_daily' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    timeout-minutes: 120
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      PEACESTOCKS_R2_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
      PEACESTOCKS_R2_BUCKET: ${{ secrets.PEACESTOCKS_R2_BUCKET }}
      PEACESTOCKS_R2_ACCESS_KEY_ID: ${{ secrets.PEACESTOCKS_R2_ACCESS_KEY_ID }}
      PEACESTOCKS_R2_SECRET_ACCESS_KEY: ${{ secrets.PEACESTOCKS_R2_SECRET_ACCESS_KEY }}
      PEACESTOCKS_SOURCE_COMMIT: ${{ github.sha }}
      PEACESTOCKS_REQUIRE_OBJECT_STORE: "1"
      PEACESTOCKS_TENMIN_DAILY: "1"
      TENMIN_DAILY_PICKS: ${{ vars.TENMIN_DAILY_PICKS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore pinned zstd 1.5.7
        id: zstd-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.local/zstd-1.5.7
          key: zstd-1.5.7-eb33e51f49a15e02-${{ runner.os }}-ubuntu-24.04
      - name: Build pinned zstd 1.5.7
        if: ${{ steps.zstd-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  zstd-1.5.7.tar.gz" | sha256sum -c -
          tar xzf zstd-1.5.7.tar.gz
          make -C zstd-1.5.7 -j"$(nproc)" zstd-release
          install -D -m 0755 zstd-1.5.7/programs/zstd ~/.local/zstd-1.5.7/bin/zstd
      - name: Use pinned zstd 1.5.7
        continue-on-error: true
        run: |
          set -euo pipefail
          ~/.local/zstd-1.5.7/bin/zstd --version | grep -F ' v1.5.7,'
          echo "$HOME/.local/zstd-1.5.7/bin" >> "$GITHUB_PATH"
      - name: Refuse a run that would write the store to the runner disk
        run: |
          test -n "$PEACESTOCKS_R2_BUCKET"
          test -n "$PEACESTOCKS_R2_ACCOUNT_ID"
          test -n "$PEACESTOCKS_R2_ACCESS_KEY_ID"
          test -n "$PEACESTOCKS_R2_SECRET_ACCESS_KEY"
          test -n "$MASSIVE_API_KEY"
      - name: Daily 10-minute picks runner
        env:
          PEACEAI_MARKETS_ROOT: ${{ runner.temp }}/peacestocks-scratch
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm scheduler
