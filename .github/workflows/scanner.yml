name: Scanner
# Restarter runs (cron "47 * * * *") are named "Scanner restarter" so the history chain, the
# restarter itself, and the stop alert never count them as a scan/history run (src/tenmin-redispatch.ts
# TENMIN_RESTARTER_RUN_NAME). Daily liquid 10-minute runs (crons "20 6 * * 2-6" / "20 10 * * 2-6")
# are named "Scanner tenmin daily": they still count as an active run (a history run yields to them
# and the chain waits), but the daily step itself only yields to a waiting scheduled "Scanner" run.
# With its kill switch off (vars.TENMIN_DAILY_ENABLED not "true") a daily tick is named
# "Scanner tenmin daily (off)", skips its job, joins no shared group, and is ignored like the
# restarter (src/scan-yield.ts isIdleScannerRun). Every other run keeps the name "Scanner".
run-name: ${{ github.event.schedule == '47 * * * *' && 'Scanner restarter' || ((github.event.schedule == '20 6 * * 2-6' || github.event.schedule == '20 10 * * 2-6') && (vars.TENMIN_DAILY_ENABLED == 'true' && 'Scanner tenmin daily' || 'Scanner tenmin daily (off)') || 'Scanner') }}

on:
  # Intentionally no push trigger: online work is schedule + workflow_dispatch only.
  # Push events that only change this file must not start a scan or backfill.
  workflow_dispatch:
    inputs:
      mode:
        description: "scan (online scheduler), backfill (daily historical evidence), tenmin_history (10-minute range history), or tenmin_daily (daily liquid 10-minute step)"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - backfill
          - tenmin_history
          - tenmin_daily
      from:
        description: "Backfill from date (YYYY-MM-DD inclusive)"
        required: false
        default: "2026-08-21"
      to:
        description: "Backfill to date (YYYY-MM-DD inclusive)"
        required: false
        default: "2026-10-02"
      max_sessions:
        description: "Max trading sessions to attempt during backfill"
        required: false
        default: "35"
      tenmin_history_reopen:
        description: "tenmin_history only: reopen sealed ranges to retry gaps + new securities (default off)"
        required: false
        default: false
        type: boolean
      tenmin_history_max_ranges:
        description: "tenmin_history only: max two-month ranges to attempt (empty = no cap)"
        required: false
        default: ""
      tenmin_history_budget_ms:
        description: "tenmin_history only: wall-clock budget in ms; default 110 min so the run stops cleanly before the 120 min job timeout"
        required: false
        default: "6600000"
      tenmin_history_chain:
        description: "tenmin_history only: run number in an auto re-dispatch chain (0 = started by a human; set by the chain)"
        required: false
        default: "0"
      tenmin_scan_check_stops:
        description: "tenmin_history only: consecutive STOP_SCAN_CHECK_FAILED runs before this one (set by the restarter's one auto-restart; 0 otherwise)"
        required: false
        default: "0"
  schedule:
    # 05:30 UTC Tue–Sat: just after midnight ET (00:30 EST / 01:30 EDT) so collectionDue targets the
    # previous ET trading day (S2: due only when ET date strictly after D). Saturday covers Friday.
    - cron: "30 5 * * 2-6"
    # Later UTC morning retry if Massive was not ready yet (04:30 EST / 05:30 EDT). Saturday covers Friday.
    - cron: "30 9 * * 2-6"
    # Ten-minute history restarter: hourly at :47 (off the :00/:30 marks). Runs ONLY the restarter
    # job (tenmin-history-fallback.yml via workflow_call); the scan job skips this cron. The decide
    # step waits (no dispatch) inside or just before a guard window and while any scan/history run
    # is active. Must match TENMIN_RESTARTER_CRON in src/tenmin-redispatch.ts.
    - cron: "47 * * * *"
    # Daily liquid 10-minute step (src/tenmin-daily-liquid.ts): 5 min after each scan guard window
    # ends, Tue–Sat (Mon–Fri sessions; no Sun/Mon run). The scan's slot is always first: these join
    # peacestocks-r2-writer and queue behind a running scan. 06:20 + 155 min budget = 08:55Z, before
    # the 09:15Z guard window; the 10:20 run catches up anything the first run left (idempotent).
    - cron: "20 6 * * 2-6"
    - cron: "20 10 * * 2-6"

# One writer at a time: scans and backfills both write R2 (month files, cursor), so they queue
# instead of overlapping. A run already in progress is never canceled.
# Restarter runs (cron "47 * * * *") write nothing to R2 and get their own per-run group: joining
# peacestocks-r2-writer would let a restarter run replace (cancel) a pending scan or history run.
# Every other run is in peacestocks-r2-writer exactly as before.
# A daily liquid tick with its kill switch off writes nothing either: it gets its own per-run group
# for the same reason (it must never replace a pending scan or history run).
concurrency:
  group: ${{ (github.event.schedule == '47 * * * *' || ((github.event.schedule == '20 6 * * 2-6' || github.event.schedule == '20 10 * * 2-6') && vars.TENMIN_DAILY_ENABLED != 'true')) && format('scanner-idle-{0}', github.run_id) || 'peacestocks-r2-writer' }}
  cancel-in-progress: false

jobs:
  scan:
    # Not on the restarter or daily liquid crons: those ticks only run their own jobs below.
    if: ${{ (github.event_name == 'schedule' && github.event.schedule != '47 * * * *' && github.event.schedule != '20 6 * * 2-6' && github.event.schedule != '20 10 * * 2-6') || github.event.inputs.mode == 'scan' }}
    # Pinned so the runner image cannot change mid-rollout; move to 26.04 deliberately later.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      PEACESTOCKS_R2_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
      PEACESTOCKS_R2_BUCKET: ${{ secrets.PEACESTOCKS_R2_BUCKET }}
      PEACESTOCKS_R2_ACCESS_KEY_ID: ${{ secrets.PEACESTOCKS_R2_ACCESS_KEY_ID }}
      PEACESTOCKS_R2_SECRET_ACCESS_KEY: ${{ secrets.PEACESTOCKS_R2_SECRET_ACCESS_KEY }}
      PEACESTOCKS_SOURCE_COMMIT: ${{ github.sha }}
      PEACESTOCKS_REQUIRE_OBJECT_STORE: "1"
      # Exactly "true" stores the scan's already-fetched grouped-daily reply as Reply Dust (no extra
      # Massive requests). Anything else leaves the scan unchanged.
      SCAN_GROUPED_REPLY_DUST: ${{ vars.SCAN_GROUPED_REPLY_DUST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reply Dust writes need exactly zstd 1.5.7 (different zstd builds can produce different bytes).
      # Build it from the checksum-verified release tarball, cache the binary, and put it first on PATH.
      # Non-blocking until Reply Dust is switched on, so a download hiccup can't stop a scan;
      # the writer itself refuses to start without exactly 1.5.7.
      - name: Restore pinned zstd 1.5.7
        id: zstd-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.local/zstd-1.5.7
          key: zstd-1.5.7-eb33e51f49a15e02-${{ runner.os }}-ubuntu-24.04
      - name: Build pinned zstd 1.5.7
        if: ${{ steps.zstd-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  zstd-1.5.7.tar.gz" | sha256sum -c -
          tar xzf zstd-1.5.7.tar.gz
          make -C zstd-1.5.7 -j"$(nproc)" zstd-release
          install -D -m 0755 zstd-1.5.7/programs/zstd ~/.local/zstd-1.5.7/bin/zstd
      - name: Use pinned zstd 1.5.7
        continue-on-error: true
        run: |
          set -euo pipefail
          ~/.local/zstd-1.5.7/bin/zstd --version | grep -F ' v1.5.7,'
          echo "$HOME/.local/zstd-1.5.7/bin" >> "$GITHUB_PATH"
      - name: Refuse a run that would write the store to the runner disk
        run: |
          test -n "$PEACESTOCKS_R2_BUCKET"
          test -n "$PEACESTOCKS_R2_ACCOUNT_ID"
          test -n "$PEACESTOCKS_R2_ACCESS_KEY_ID"
          test -n "$PEACESTOCKS_R2_SECRET_ACCESS_KEY"
          test -n "$MASSIVE_API_KEY"
          test -n "$PEACESTOCKS_SOURCE_COMMIT"
      - name: Run online scanner host
        env:
          PEACEAI_MARKETS_ROOT: ${{ runner.temp }}/peacestocks-scratch
        run: pnpm scheduler
      # Daily Massive plan probe (1 request, key already held by this job; logs booleans only, never the URL).
      # Detection only for now: the plan file feeds the auto-backfill decision (src/tenmin-backfill.ts).
      - name: Ten-minute stored floor (R2 HEADs only)
        id: backfill_floor
        if: ${{ always() }}
        continue-on-error: true
        run: pnpm -s exec tsx src/tenmin-backfill-cli.ts floor
      - name: Massive plan probe (daily)
        if: ${{ always() }}
        continue-on-error: true
        env:
          TENMIN_PLAN_FILE: ${{ runner.temp }}/tenmin-plan.json
          TENMIN_EARLIEST_STORED: ${{ steps.backfill_floor.outputs.earliest_stored }}
        run: pnpm -s exec tsx src/massive-plan-probe.ts
      - name: Auto-backfill decision (log only; dispatch not wired yet)
        if: ${{ always() }}
        continue-on-error: true
        env:
          TENMIN_PLAN_FILE: ${{ runner.temp }}/tenmin-plan.json
          TENMIN_EARLIEST_STORED: ${{ steps.backfill_floor.outputs.earliest_stored }}
        run: pnpm -s exec tsx src/tenmin-backfill-cli.ts decide
      # Every NYSE trading session from the first stored one to the last that should be stored must
      # have its month JSONL and daily-bars pack (src/daily-bars-coverage.ts; LIST only, no Massive).
      # A hole or a stale store fails this job loudly (annotation + failed run), after the scan wrote.
      - name: Daily-bars coverage check
        if: ${{ always() }}
        run: pnpm exec tsx src/daily-bars-coverage.ts

  # Daily liquid 10-minute step: the just-closed session(s) for the top TENMIN_DAILY_LIQUID_N names
  # (default 500, cap 1000) by trailing dollar volume from sessions strictly before each session.
  # Same Reply Dust range format the history chain uses (rd-origin=daily-close). Kill switch: off
  # unless vars.TENMIN_DAILY_ENABLED is exactly "true". Never runs inside a guard window, yields to a
  # waiting scheduled scan, stops at TENMIN_DAILY_MAX_REQUESTS (default 720) or the 155 min budget,
  # and never refetches or overwrites a stored session. Shares the R2 writer group, so it never runs
  # at the same time as a scan or history run (one Massive key, one pace).
  tenmin_daily:
    if: ${{ vars.TENMIN_DAILY_ENABLED == 'true' && ((github.event_name == 'schedule' && (github.event.schedule == '20 6 * * 2-6' || github.event.schedule == '20 10 * * 2-6')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'tenmin_daily')) }}
    runs-on: ubuntu-24.04
    # actions: read lets the step see a waiting scheduled scan and yield to it.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 170
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      PEACESTOCKS_R2_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
      PEACESTOCKS_R2_BUCKET: ${{ secrets.PEACESTOCKS_R2_BUCKET }}
      PEACESTOCKS_R2_ACCESS_KEY_ID: ${{ secrets.PEACESTOCKS_R2_ACCESS_KEY_ID }}
      PEACESTOCKS_R2_SECRET_ACCESS_KEY: ${{ secrets.PEACESTOCKS_R2_SECRET_ACCESS_KEY }}
      PEACESTOCKS_SOURCE_COMMIT: ${{ github.sha }}
      PEACESTOCKS_REQUIRE_OBJECT_STORE: "1"
      TENMIN_DAILY_ENABLED: ${{ vars.TENMIN_DAILY_ENABLED }}
      TENMIN_DAILY_LIQUID_N: ${{ vars.TENMIN_DAILY_LIQUID_N }}
      TENMIN_DAILY_MAX_REQUESTS: ${{ vars.TENMIN_DAILY_MAX_REQUESTS }}
      # The step skips (0 Massive requests) unless this is exactly "true": the history redispatch is
      # paused while another job owns the shared key (src/tenmin-daily-liquid.ts tenMinDailyRedispatchHold).
      TENMIN_AUTO_REDISPATCH: ${{ vars.TENMIN_AUTO_REDISPATCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reply Dust writes need exactly zstd 1.5.7; the step refuses to start without it.
      - name: Restore pinned zstd 1.5.7
        id: zstd-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.local/zstd-1.5.7
          key: zstd-1.5.7-eb33e51f49a15e02-${{ runner.os }}-ubuntu-24.04
      - name: Build pinned zstd 1.5.7
        if: ${{ steps.zstd-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  zstd-1.5.7.tar.gz" | sha256sum -c -
          tar xzf zstd-1.5.7.tar.gz
          make -C zstd-1.5.7 -j"$(nproc)" zstd-release
          install -D -m 0755 zstd-1.5.7/programs/zstd ~/.local/zstd-1.5.7/bin/zstd
      - name: Use pinned zstd 1.5.7
        continue-on-error: true
        run: |
          set -euo pipefail
          ~/.local/zstd-1.5.7/bin/zstd --version | grep -F ' v1.5.7,'
          echo "$HOME/.local/zstd-1.5.7/bin" >> "$GITHUB_PATH"
      - name: Refuse a run that would write the store to the runner disk
        run: |
          test -n "$PEACESTOCKS_R2_BUCKET"
          test -n "$PEACESTOCKS_R2_ACCOUNT_ID"
          test -n "$PEACESTOCKS_R2_ACCESS_KEY_ID"
          test -n "$PEACESTOCKS_R2_SECRET_ACCESS_KEY"
          test -n "$MASSIVE_API_KEY"
      - name: Daily liquid 10-minute step
        env:
          PEACEAI_MARKETS_ROOT: ${{ runner.temp }}/peacestocks-scratch
          GITHUB_TOKEN: ${{ github.token }}
          TENMIN_DAILY_REPORT_FILE: ${{ runner.temp }}/tenmin-daily-report.json
        run: pnpm exec tsx src/tenmin-daily-liquid.ts
      - name: Keep this run's report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tenmin-daily-report
          path: ${{ runner.temp }}/tenmin-daily-report.json
          retention-days: 14
          if-no-files-found: warn

  # Hourly ten-minute history restarter (cron "47 * * * *" only). Same decide-and-dispatch and stop
  # alert as tenmin-history-fallback.yml (reused via workflow_call, not duplicated). It rides on this
  # workflow's schedule because the fallback file's own schedule never fired.
  restarter:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '47 * * * *' }}
    permissions:
      contents: read
      actions: write
      issues: write
    uses: ./.github/workflows/tenmin-history-fallback.yml

  # Chain follow-up (no cron reliance): when a scan, daily liquid step, or markets backfill run ends, run the same
  # decide-and-dispatch as the restarter. A history run that stopped with WAIT_RUN_ACTIVE behind this run is
  # restarted right after it (the fallback never counts its own GITHUB_RUN_ID as active; the dispatched run
  # queues in peacestocks-r2-writer until this run ends). Same kill switch, same rules, same stop alert.
  chain_followup:
    needs: [scan, tenmin_daily, backfill]
    if: ${{ always() && (needs.scan.result != 'skipped' || needs.tenmin_daily.result != 'skipped' || needs.backfill.result != 'skipped') }}
    permissions:
      contents: read
      actions: write
      issues: write
    uses: ./.github/workflows/tenmin-history-fallback.yml

  # Restarter guard (same reliable :47 cron, never gated on the variable): if the history redispatch gate is off or
  # still waiting on a one-off seal and no one-off fetch has run for over 30 min, open one scanner-alert issue
  # (deduped by title while open). Read-only except the issue. Logic: planGateGuard (src/tenmin-gate.ts).
  restarter_guard:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '47 * * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENMIN_AUTO_REDISPATCH: ${{ vars.TENMIN_AUTO_REDISPATCH }}
          TENMIN_ONEOFF_WORKFLOWS: oct2024-tenmin.yml
        run: pnpm -s exec tsx src/tenmin-gate.ts guard

  # Missed-scheduled-scan backstop (same reliable :47 cron): if the 05:30/09:30 UTC scheduled scan never
  # started, dispatch one mode=scan run. Harmless when redundant (collectionDue). Logic: src/scan-backstop.ts.
  scan_backstop:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '47 * * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan backstop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm -s exec tsx src/scan-backstop.ts

  backfill:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backfill' }}
    # Pinned so the runner image cannot change mid-rollout; move to 26.04 deliberately later.
    runs-on: ubuntu-24.04
    # actions: read lets backfill see a queued scan and yield the Massive budget to it.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 120
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      PEACESTOCKS_R2_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
      PEACESTOCKS_R2_BUCKET: ${{ secrets.PEACESTOCKS_R2_BUCKET }}
      PEACESTOCKS_R2_ACCESS_KEY_ID: ${{ secrets.PEACESTOCKS_R2_ACCESS_KEY_ID }}
      PEACESTOCKS_R2_SECRET_ACCESS_KEY: ${{ secrets.PEACESTOCKS_R2_SECRET_ACCESS_KEY }}
      PEACESTOCKS_SOURCE_COMMIT: ${{ github.sha }}
      PEACESTOCKS_REQUIRE_OBJECT_STORE: "1"
      MARKETS_BACKFILL_FROM: ${{ github.event.inputs.from }}
      MARKETS_BACKFILL_TO: ${{ github.event.inputs.to }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reply Dust writes need exactly zstd 1.5.7 (different zstd builds can produce different bytes).
      # Build it from the checksum-verified release tarball, cache the binary, and put it first on PATH.
      # Non-blocking until Reply Dust is switched on, so a download hiccup can't stop a scan;
      # the writer itself refuses to start without exactly 1.5.7.
      - name: Restore pinned zstd 1.5.7
        id: zstd-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.local/zstd-1.5.7
          key: zstd-1.5.7-eb33e51f49a15e02-${{ runner.os }}-ubuntu-24.04
      - name: Build pinned zstd 1.5.7
        if: ${{ steps.zstd-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  zstd-1.5.7.tar.gz" | sha256sum -c -
          tar xzf zstd-1.5.7.tar.gz
          make -C zstd-1.5.7 -j"$(nproc)" zstd-release
          install -D -m 0755 zstd-1.5.7/programs/zstd ~/.local/zstd-1.5.7/bin/zstd
      - name: Use pinned zstd 1.5.7
        continue-on-error: true
        run: |
          set -euo pipefail
          ~/.local/zstd-1.5.7/bin/zstd --version | grep -F ' v1.5.7,'
          echo "$HOME/.local/zstd-1.5.7/bin" >> "$GITHUB_PATH"
      - name: Refuse a run that would write the store to the runner disk
        run: |
          test -n "$PEACESTOCKS_R2_BUCKET"
          test -n "$PEACESTOCKS_R2_ACCOUNT_ID"
          test -n "$PEACESTOCKS_R2_ACCESS_KEY_ID"
          test -n "$PEACESTOCKS_R2_SECRET_ACCESS_KEY"
          test -n "$MASSIVE_API_KEY"
          test -n "$PEACESTOCKS_SOURCE_COMMIT"
          test -n "$MARKETS_BACKFILL_FROM"
          test -n "$MARKETS_BACKFILL_TO"
      - name: Daily historical backfill into R2
        env:
          PEACEAI_MARKETS_ROOT: ${{ runner.temp }}/peacestocks-scratch
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm backfill --from "$MARKETS_BACKFILL_FROM" --to "$MARKETS_BACKFILL_TO" --max-sessions "${{ github.event.inputs.max_sessions }}"

  # Dispatch only: never on this workflow's schedule. Shares peacestocks-r2-writer concurrency with
  # scan/backfill so it queues behind (or ahead of) them; the host also yields via scanYieldReason.
  # Auto re-dispatch (repo variable TENMIN_AUTO_REDISPATCH == "true"): the last step dispatches the
  # next run on a clean partial. When it waits on a guard window it also dispatches
  # tenmin-history-fallback.yml (wait_for_guard_window_end), which sleeps outside this concurrency
  # group until the window ends and then restarts the chain; the hourly restarter covers the rest.
  tenmin_history:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'tenmin_history' }}
    runs-on: ubuntu-24.04
    # actions: write lets the last step dispatch the next run (GITHUB_TOKEN workflow_dispatch does
    # start a new run) and read the queue so it never dispatches while another run is waiting.
    permissions:
      contents: read
      actions: write
      # issues: write lets the last step open/close the scanner-alert issue.
      issues: write
    timeout-minutes: 120
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      PEACESTOCKS_R2_ACCOUNT_ID: ${{ secrets.PEACESTOCKS_R2_ACCOUNT_ID }}
      PEACESTOCKS_R2_BUCKET: ${{ secrets.PEACESTOCKS_R2_BUCKET }}
      PEACESTOCKS_R2_ACCESS_KEY_ID: ${{ secrets.PEACESTOCKS_R2_ACCESS_KEY_ID }}
      PEACESTOCKS_R2_SECRET_ACCESS_KEY: ${{ secrets.PEACESTOCKS_R2_SECRET_ACCESS_KEY }}
      PEACESTOCKS_SOURCE_COMMIT: ${{ github.sha }}
      PEACESTOCKS_REQUIRE_OBJECT_STORE: "1"
      PEACESTOCKS_TENMIN_HISTORY: "1"
      # Dated ticker reference index phase (off unless exactly "true"). Probe unless FULL=true.
      TICKER_INDEX_DATED: ${{ vars.TICKER_INDEX_DATED }}
      TICKER_INDEX_DATED_FULL: ${{ vars.TICKER_INDEX_DATED_FULL }}
      # TENMIN_HISTORY_MAX_RANGE_END is retired (2026-10-11): the chain has no end cap. Unset = no
      # cap in code; the parser stays only so an old STOP_RANGE_END_CAP record restarts cleanly.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # History writing needs exactly zstd 1.5.7; host refuses to start without it (fatal even if
      # these steps are continue-on-error, matching scan/backfill pin steps).
      - name: Restore pinned zstd 1.5.7
        id: zstd-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.local/zstd-1.5.7
          key: zstd-1.5.7-eb33e51f49a15e02-${{ runner.os }}-ubuntu-24.04
      - name: Build pinned zstd 1.5.7
        if: ${{ steps.zstd-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  zstd-1.5.7.tar.gz" | sha256sum -c -
          tar xzf zstd-1.5.7.tar.gz
          make -C zstd-1.5.7 -j"$(nproc)" zstd-release
          install -D -m 0755 zstd-1.5.7/programs/zstd ~/.local/zstd-1.5.7/bin/zstd
      - name: Use pinned zstd 1.5.7
        continue-on-error: true
        run: |
          set -euo pipefail
          ~/.local/zstd-1.5.7/bin/zstd --version | grep -F ' v1.5.7,'
          echo "$HOME/.local/zstd-1.5.7/bin" >> "$GITHUB_PATH"
      - name: Refuse a run that would write the store to the runner disk
        run: |
          test -n "$PEACESTOCKS_R2_BUCKET"
          test -n "$PEACESTOCKS_R2_ACCOUNT_ID"
          test -n "$PEACESTOCKS_R2_ACCESS_KEY_ID"
          test -n "$PEACESTOCKS_R2_SECRET_ACCESS_KEY"
          test -n "$MASSIVE_API_KEY"
          test -n "$PEACESTOCKS_SOURCE_COMMIT"
      - name: Ten-minute history runner (Reply Dust ranges)
        id: history
        env:
          PEACEAI_MARKETS_ROOT: ${{ runner.temp }}/peacestocks-scratch
          GITHUB_TOKEN: ${{ github.token }}
          TENMIN_OUTCOME_FILE: ${{ runner.temp }}/tenmin-history-outcome.json
          PEACESTOCKS_TENMIN_HISTORY_REOPEN: ${{ github.event.inputs.tenmin_history_reopen == 'true' && '1' || '' }}
          PEACESTOCKS_TENMIN_HISTORY_MAX_RANGES: ${{ github.event.inputs.tenmin_history_max_ranges }}
          PEACESTOCKS_TENMIN_HISTORY_BUDGET_MS: ${{ github.event.inputs.tenmin_history_budget_ms }}
        run: pnpm scheduler
      # Decision logic is decideTenMinRedispatch (src/tenmin-redispatch.ts, unit-tested); it stops
      # on any refusal, error, outage, failure, bounded manual run, chain cap, or kill switch off,
      # and waits (no dispatch) in or just before a guard window or while another run is queued.
      # Right after a dispatch it lists scanner.yml runs; if a scheduled run created in the last 10 min
      # was cancelled it rewrites this run's record to STOP_SCAN_CANCELLED (hard stop for the
      # fallback), cancels the just-dispatched tenmin_history run while still queued/waiting/pending/
      # requested/in_progress (skips and reports if already completed), and fails with
      # TENMIN_REDISPATCH_SCAN_CANCELLED. Cancelling in_progress is safe: that run's always() chain
      # step sees the history step cancelled and records STOP_JOB_CANCELLED. The upload step below
      # runs after this (if: always), so the rewritten stop record is what the fallback reads.
      # Massive plan probe (1 request, before the chain step): olderReachable => plan window grew.
      - name: Massive plan probe
        if: ${{ always() }}
        continue-on-error: true
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          TENMIN_PLAN_FILE: ${{ runner.temp }}/tenmin-plan.json
        run: pnpm -s exec tsx src/massive-plan-probe.ts
      - name: Auto re-dispatch (chain)
        id: redispatch
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENMIN_AUTO_REDISPATCH: ${{ vars.TENMIN_AUTO_REDISPATCH }}
          TENMIN_AUTO_REDISPATCH_MAX_CHAIN: ${{ vars.TENMIN_AUTO_REDISPATCH_MAX_CHAIN }}
          TENMIN_CHAIN: ${{ github.event.inputs.tenmin_history_chain }}
          TENMIN_SCAN_CHECK_STOPS: ${{ github.event.inputs.tenmin_scan_check_stops }}
          TENMIN_STEP_OUTCOME: ${{ steps.history.outcome }}
          TENMIN_OUTCOME_FILE: ${{ runner.temp }}/tenmin-history-outcome.json
          TENMIN_RECORD_FILE: ${{ runner.temp }}/tenmin-history-record.json
          TENMIN_PLAN_FILE: ${{ runner.temp }}/tenmin-plan.json
        run: pnpm exec tsx src/tenmin-redispatch.ts chain
      # Plan upgrade: one deduped scanner-alert issue (older history reachable / higher rate). Backfilling older
      # history needs the range planner's 2-year window and first-range anchor widened (person decision).
      - name: Plan upgrade notice
        if: ${{ always() && steps.redispatch.outputs.plan_upgraded == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          t="Massive plan upgrade detected: older history reachable"
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --label scanner-alert --state open --search "$t in:title" --json number --jq '.[0].number // empty')"
          [ -n "$n" ] && { echo "PLAN NOTICE: already open"; exit 0; }
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$t" --label scanner-alert --assignee PeaceG03 --body "The plan probe reached history older than the current window. Run: $RUN_URL"
      # The fallback workflow reads the newest record to decide whether to restart the chain.
      - name: Keep this run's record for the fallback
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tenmin-history-record
          path: ${{ runner.temp }}/tenmin-history-record.json
          retention-days: 14
          if-no-files-found: warn
      # Stop alert: one GitHub issue (label scanner-alert, assigned to the repo owner) when the chain
      # really stops or fails; comments on an open one instead of opening another; closes it with
      # "Chain running again" when a later run chains. No alert for a manual pause or a planned wait.
      # Logic: planTenMinAlert (src/tenmin-alert.ts, unit-tested). Never fails the job.
      - name: Stop alert (issue)
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TENMIN_AUTO_REDISPATCH: ${{ vars.TENMIN_AUTO_REDISPATCH }}
          TENMIN_HISTORY_STEP: ${{ steps.history.outcome }}
          TENMIN_REDISPATCH_STEP: ${{ steps.redispatch.outcome }}
          TENMIN_NEXT_ACTION: ${{ steps.redispatch.outputs.next_action }}
          TENMIN_REASON: ${{ steps.redispatch.outputs.reason }}
          TENMIN_RECORD_FILE: ${{ runner.temp }}/tenmin-history-record.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! pnpm exec tsx src/tenmin-alert.ts chain; then
            # Last resort when the alert script itself cannot run: one generic alert.
            body="The scanner alert check could not run. History step: ${TENMIN_HISTORY_STEP:-unknown}, chain step: ${TENMIN_REDISPATCH_STEP:-unknown}. Run: $RUN_URL"
            n="$(gh issue list --repo "$GITHUB_REPOSITORY" --label scanner-alert --state open --json number --jq '.[0].number // empty')"
            if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "Scanner stopped: alert check failed" --label scanner-alert --assignee PeaceG03 --body "$body"; fi
          fi
